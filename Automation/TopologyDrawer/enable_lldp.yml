---
- name: Enable LLDP on devices
  hosts: all_devices
  gather_facts: false
  connection: ansible.netcommon.network_cli

  tasks:
    - name: Enable LLDP globally
      ios_lldp_global:
        config:
          enabled: true
        state: merged
      register: output

    - name: Show output
      debug:
        var: output
