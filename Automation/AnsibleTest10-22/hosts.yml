---
router_group_1:
  hosts:
    R1:
      ansible_host: 10.132.102.34
    R2:
      ansible_host: 10.132.80.130
  vars:
    ansible_user: cisco
    ansible_ssh_pass: cisco
    ansible_become_pass: cisco

router_group_2:
  hosts:
    R3:
      ansible_host: 10.132.73.192
  vars:
    ansible_user: '{{ lookup("env", "router_group_2_ansible_user") }}' #ocsic
    ansible_ssh_pass: '{{ lookup("env", "router_group_2_ansible_ssh_pass") }}' #ocsic
    ansible_become_pass: '{{ lookup("env", "router_group_2_ansible_become_pass") }}' #ocsic

all_routers:
  children:
    router_group_1:
    router_group_2:
  vars:
    ansible_connection: network_cli
    ansible_network_os: ios
    ansible_become: yes
    ansible_become_method: enable