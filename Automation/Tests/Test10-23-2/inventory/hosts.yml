---
router_group_1:
  hosts:
    R1:
      ansible_host: 10.99.99.30
    R2:
      ansible_host: 10.99.99.40

switch_group_1:
  hosts:
    SW1:
      ansible_host: 10.99.99.10
    SW2:
      ansible_host: 10.99.99.20

all_devices:
  children:
    router_group_1:
    switch_group_1:
  vars:
    ansible_user: cisco
    ansible_ssh_pass: cisco
    ansible_become_pass: cisco
    ansible_connection: network_cli
    ansible_network_os: ios
    ansible_become: yes
    ansible_become_method: enable