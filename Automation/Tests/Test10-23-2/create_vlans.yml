---
- name: Create VLANs on devices
  hosts: switch_group_1
  gather_facts: no
  vars:
    vlans: {
      "10": {"description": "floor_1", "ip": "10.0.10.1"},
      "20": {"description": "floor_2", "ip": "10.0.20.1"},
      "30": {"description": "floor_3", "ip": "10.0.30.1"}
      }
  tasks:
    - name: Create VLANs
      ios_config:
        lines:
          - vlan {{ item.key }}
      with_dict: "{{ vlans }}"
    - name: Create VLAN interfaces
      ios_config:
        lines:
          - interface vlan {{ item.key }}
          - description {{ item.value.description }}
          - ip address {{ item.value.ip }} 255.255.255.0
      with_dict: "{{ vlans }}"
    - name: Show VLANs
      ios_command:
        commands:
          - show vlan brief
      register: vlan_output
    - name: Show VLAN output
      debug:
        var: vlan_output.stdout[0]
